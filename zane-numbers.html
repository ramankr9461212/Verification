<title>Zane's Number Pad</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap">
<style>
  /* Layout: one screen — big display of the last number on top, chunky 3x4 keypad below. Single bright playroom look, by choice. */
  :root {
    --bg: #fff6d8;
    --ink: #2b2140;
    --panel: #ffffff;
    --shadow: #2b214033;
    --k1: #ff5a5f; --k2: #ff9f1c; --k3: #ffd23f; --k4: #3ec300; --k5: #1fb5c9;
    --k6: #3a86ff; --k7: #8f5cff; --k8: #ff6fb5; --k9: #00a878; --k0: #f25c05;
    --font: "Baloo 2", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow: hidden;
  }
  .app {
    height: 100%;
    box-sizing: border-box;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 14px;
    padding-block: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    max-width: 560px;
    margin: 0 auto;
  }
  .display {
    background: var(--panel);
    border-radius: 28px;
    box-shadow: 0 6px 0 var(--shadow);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 0;
    padding: 8px;
  }
  .big {
    font-size: clamp(90px, 22vh, 200px);
    font-weight: 800;
    line-height: 1;
    color: var(--current, var(--ink));
    font-variant-numeric: tabular-nums;
  }
  .word {
    font-size: clamp(22px, 5vh, 40px);
    font-weight: 600;
    letter-spacing: 0.02em;
    min-height: 1.2em;
  }
  .pop { animation: pop 0.35s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { from { transform: scale(0.4) rotate(-8deg); } to { transform: scale(1) rotate(0); } }

  .pad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .key {
    font-family: var(--font);
    font-weight: 800;
    font-size: clamp(40px, 8vh, 72px);
    line-height: 1;
    color: #fff;
    text-shadow: 0 3px 0 #0000002e;
    border: 0;
    border-radius: 24px;
    aspect-ratio: 1.25;
    max-width: 100%;
    background: var(--c);
    box-shadow: 0 7px 0 color-mix(in srgb, var(--c) 60%, #000);
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.06s, box-shadow 0.06s;
  }
  .key:active, .key.down { transform: translateY(6px); box-shadow: 0 1px 0 color-mix(in srgb, var(--c) 60%, #000); }
  .key:focus-visible { outline: 5px solid var(--ink); outline-offset: 3px; }
  .key.zero { grid-column: 2; }
  .key[data-n="3"] { color: var(--ink); text-shadow: none; }

  .hint { text-align: center; font-size: 15px; opacity: 0.7; }
  @media (max-height: 640px) { .key { aspect-ratio: 1.7; } }
  @media (prefers-reduced-motion: reduce) { .pop { animation: none; } .key { transition: none; } }
</style>

<div class="app">
  <div class="display" aria-live="polite">
    <div class="big" id="big">5</div>
    <div class="word" id="word">Press a number!</div>
  </div>

  <div class="pad" id="pad">
    <button class="key" id="k1" data-n="1" style="--c:var(--k1)">1</button>
    <button class="key" id="k2" data-n="2" style="--c:var(--k2)">2</button>
    <button class="key" id="k3" data-n="3" style="--c:var(--k3)">3</button>
    <button class="key" id="k4" data-n="4" style="--c:var(--k4)">4</button>
    <button class="key" id="k5" data-n="5" style="--c:var(--k5)">5</button>
    <button class="key" id="k6" data-n="6" style="--c:var(--k6)">6</button>
    <button class="key" id="k7" data-n="7" style="--c:var(--k7)">7</button>
    <button class="key" id="k8" data-n="8" style="--c:var(--k8)">8</button>
    <button class="key" id="k9" data-n="9" style="--c:var(--k9)">9</button>
    <button class="key zero" id="k0" data-n="0" style="--c:var(--k0)">0</button>
  </div>

  <div class="hint" id="hint">Turn the sound up. Tap a number and it says it out loud.</div>
</div>

<script>
  const WORDS = ["Zero","One","Two","Three","Four","Five","Six","Seven","Eight","Nine"];
  const big = document.getElementById("big");
  const word = document.getElementById("word");
  const hint = document.getElementById("hint");
  const synth = window.speechSynthesis;
  let voice = null;

  function pickVoice() {
    if (!synth) return;
    const vs = synth.getVoices();
    voice = vs.find(v => /^en(-|_)/i.test(v.lang) && /google|samantha|natural/i.test(v.name))
         || vs.find(v => /^en/i.test(v.lang)) || null;
  }
  if (synth) { pickVoice(); synth.onvoiceschanged = pickVoice; }
  else { hint.textContent = "This browser can't speak. Try Chrome or Safari."; }

  function shout(n) {
    // Show it big
    big.textContent = n;
    big.style.setProperty("--current", `var(--k${n})`);
    word.textContent = WORDS[n] + "!";
    big.classList.remove("pop"); void big.offsetWidth; big.classList.add("pop");

    // Say it loud
    if (!synth) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(WORDS[n] + "!");
    if (voice) u.voice = voice;
    u.lang = voice ? voice.lang : "en-US";
    u.volume = 1;
    u.rate = 0.9;
    u.pitch = 1.3;
    synth.speak(u);
  }

  document.getElementById("pad").addEventListener("click", e => {
    const k = e.target.closest(".key");
    if (k) shout(Number(k.dataset.n));
  });

  // Keyboard number keys work too
  document.addEventListener("keydown", e => {
    if (!/^[0-9]$/.test(e.key) || e.repeat) return;
    const k = document.getElementById("k" + e.key);
    k.classList.add("down");
    setTimeout(() => k.classList.remove("down"), 120);
    shout(Number(e.key));
  });
</script>
